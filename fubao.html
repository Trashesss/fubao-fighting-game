<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>푸바오 뷰어</title>
    <style>
      html, body { margin: 0; height: 100%; background: #d9d9d6; overflow: hidden; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      #ui { position: fixed; top: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100vw - 24px); }
      #ui button { border: 0; border-radius: 6px; padding: 6px 10px; background: #2b2b2b; color: #f2f2f2; font-size: 13px; cursor: pointer; }
      #ui button[aria-pressed='true'] { background: #c0392b; }
      #info { position: fixed; bottom: 12px; left: 12px; padding: 6px 10px; border-radius: 6px; background: rgb(0 0 0 / 0.6); color: #fff; font: 12px ui-monospace, monospace; }
      body.shot #ui, body.shot #info { display: none; }
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <div id="info"></div>
    <script type="module" src="/src/viewer/fubao.ts"></script>
  </body>
</html>
